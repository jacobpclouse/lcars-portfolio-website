				<section class="portfolio-section portfolio-education" id="education" aria-labelledby="education-title">
					<p class="portfolio-kicker">Education</p>

				<section class="portfolio-section" id="skills" aria-labelledby="skills-title">

					<h2 id="skills-title">Skills</h2>
					<div class="portfolio-skill-grid">
						<div class="portfolio-card"><h3>Mainframe &amp; enterprise</h3><p>COBOL, JCL, IBM z/OS, DB2, SQL/PL-SQL, mainframe application maintenance</p></div>
						<div class="portfolio-card"><h3>Application development</h3><p>Python, PHP, Laravel, JavaScript, Vue.js, Flask, Django, REST APIs</p></div>
						<div class="portfolio-card"><h3>Data, cloud &amp; automation</h3><p>SQL Server, Dremio, Cassandra, Azure DevOps, AWS, Power BI, Power Automate, Ansible</p></div>
						<div class="portfolio-card"><h3>Delivery &amp; collaboration</h3><p>Agile SDLC, requirements analysis, technical design, test planning, documentation, cross-functional delivery</p></div>

				</section>

				<section class="portfolio-contact" id="contact" aria-labelledby="contact-title">
					<div><p class="portfolio-kicker">Start a conversation</p><h2 id="contact-title">Let’s build something reliable.</h2><p>Interested in enterprise software, platform modernization, or practical automation? I’d be glad to connect.</p></div>

		function createAnchor(className, label, target) {
			const link = document.createElement("a");
			link.className = className;
			link.href = `#${target}`;
			link.textContent = label;
			return link;
		}

		function prepareTheme(template) {
			const stylesheet = template.head.querySelector('link[rel="stylesheet"]');
			const main = template.body.querySelector("main");
			const themeUrl = new URL(THEMES[ACTIVE_THEME], document.baseURI);
			if (!stylesheet || !main) {
				throw new Error(`The selected theme "${ACTIVE_THEME}" is missing its stylesheet or main content region.`);
			}

			document.title = "Jacob Clouse | Software Engineer";
			const themeStylesheet = document.createElement("link");
			themeStylesheet.rel = "stylesheet";
			themeStylesheet.href = new URL(stylesheet.getAttribute("href"), themeUrl).href;
			document.head.append(themeStylesheet);

			const portfolioStylesheet = document.createElement("link");
			portfolioStylesheet.rel = "stylesheet";
			portfolioStylesheet.href = "assets/portfolio.css";
			document.head.append(portfolioStylesheet);

			for (const element of template.body.querySelectorAll("audio[src], img[src]")) {
				element.src = new URL(element.getAttribute("src"), themeUrl).href;
			}

			main.innerHTML = portfolioContent;
			template.body.id = "top";

			const topNavigation = template.body.querySelector("nav");
			if (topNavigation) {
				topNavigation.classList.add("portfolio-nav");
				topNavigation.setAttribute("aria-label", "Portfolio sections");
				const navigationItems = [
					["01-ABOUT", "about"],
					["02-EXPERIENCE", "experience"],
					["03-WORK", "selected-work"],
					["04-CONTACT", "contact"]
				];
				topNavigation.replaceChildren(
					...navigationItems.map(([label, target], index) => {
						const animationClass = index === 0 || index === 1 || index === 3 ? " animation-on" : "";
						return createAnchor(`nav-${index + 1}${animationClass}`, label, target);
					})
				);
			}

			const sidebarLinks = [
				[".panel-3", "ABOUT", "about"],
				[".panel-4", "JOBS", "experience"],
				[".panel-5", "WORK", "selected-work"],
				[".panel-6", "SKILLS", "skills"],
				[".panel-7", "EDU", "education"],
				[".panel-8", "CONTACT", "contact"]
			];
			for (const [selector, label, target] of sidebarLinks) {
				const button = template.body.querySelector(selector);
				if (button) {
					button.replaceWith(createAnchor(button.className, label, target));
				}
			}

			for (const button of template.body.querySelectorAll("button")) {
				button.removeAttribute("onclick");
				if (button.id !== "topBtn") {
					button.tabIndex = -1;
					button.setAttribute("aria-hidden", "true");
				}
			}
			const topButton = template.body.querySelector("#topBtn");
			if (topButton) {
				topButton.type = "button";
				topButton.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
			}

			const footer = template.body.querySelector("footer");
			if (footer) {
				for (const text of footer.querySelectorAll("*")) {
					for (const node of text.childNodes) {
						if (node.nodeType === Node.TEXT_NODE && /Content\s*©?\s*2026/i.test(node.textContent)) {
							node.textContent = "© 2026 Jacob Clouse · ";
						}
					}
				}
				for (const node of footer.childNodes) {
					if (node.nodeType === Node.TEXT_NODE && /Content\s*©?\s*2026/i.test(node.textContent)) {
						node.textContent = "© 2026 Jacob Clouse · ";
					}
				}
			}

			for (const script of template.body.querySelectorAll("script")) {
				script.remove();
			}
			document.body.replaceWith(template.body);
			return template;
		}

		async function loadPortfolio() {
			if (!Object.hasOwn(THEMES, ACTIVE_THEME)) {
				throw new Error(`Unknown theme "${ACTIVE_THEME}". Choose one of: ${Object.keys(THEMES).join(", ")}.`);
			}

			const response = await fetch(THEMES[ACTIVE_THEME]);
			if (!response.ok) {
				throw new Error(`Could not load ${THEMES[ACTIVE_THEME]} (HTTP ${response.status}).`);
			}
			const source = await response.text();
			const template = new DOMParser().parseFromString(source, "text/html");
			const sourceScript = template.querySelector("script[src]");
			prepareTheme(template);

			if (sourceScript) {
				const script = document.createElement("script");
				script.src = new URL(sourceScript.getAttribute("src"), new URL(THEMES[ACTIVE_THEME], document.baseURI)).href;
				script.async = false;
				document.body.append(script);
			}
		}

		loadPortfolio().catch((error) => {
			console.error("Portfolio could not be initialized.", error);
			const errorMain = document.createElement("main");
			errorMain.className = "portfolio-load-error";
			const heading = document.createElement("h1");
			heading.textContent = "Portfolio unavailable";
			const message = document.createElement("p");
			message.textContent = error.message;
			const instructions = document.createElement("p");
			instructions.textContent = "Open this site through a local web server (not directly as a file) and confirm the selected theme file is present.";
			errorMain.append(heading, message, instructions);
			document.body.replaceChildren(errorMain);
		});
	</script>
